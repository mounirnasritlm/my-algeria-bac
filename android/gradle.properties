org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Cap build memory so Gradle does not consume all RAM on low-memory machines.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
# Do not auto-download missing SDK components (e.g. the ~1GB NDK) that this
# pure-Dart app does not actually need.
android.builder.sdkDownload=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
